name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', 'stable']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - run: go mod tidy -diff
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Install the vet tools the way the README does
        run: go install ./funcbody-vet ./imports-vet ./vardecl-vet
      - run: go vet -vettool="$(go env GOPATH)/bin/imports-vet" ./...
      - run: go vet -vettool="$(go env GOPATH)/bin/funcbody-vet" ./...
      - run: go vet -vettool="$(go env GOPATH)/bin/vardecl-vet" ./...
